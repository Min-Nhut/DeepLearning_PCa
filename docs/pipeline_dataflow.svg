<text x="1285.0" y="423.5" text-anchor="middle" font-size="9.8" font-weight="400" fill="#3d4f66">chuẩn hóa ImageNet</text>
<rect x="1060" y="466" width="450" height="62" rx="6" fill="#ffffff" stroke="#2f6f4f" stroke-width="1.5"/>
<text x="1285.0" y="493.5" text-anchor="middle" font-size="11" font-weight="700" fill="#0b0b0b">Hai mạng cố định</text>
<text x="1285.0" y="507.5" text-anchor="middle" font-size="9.8" font-weight="400" fill="#3d4f66">densenet121 + efficientnet_b0</text>
<rect x="1060" y="550" width="450" height="62" rx="6" fill="#ffffff" stroke="#2f6f4f" stroke-width="1.5"/>
<text x="1285.0" y="577.5" text-anchor="middle" font-size="11" font-weight="700" fill="#0b0b0b">softmax 4 lớp mỗi mạng</text>
<text x="1285.0" y="591.5" text-anchor="middle" font-size="9.8" font-weight="400" fill="#3d4f66">trung bình trên MỌI mảnh có mô</text>
<rect x="1060" y="634" width="450" height="62" rx="6" fill="#ffffff" stroke="#2f6f4f" stroke-width="1.5"/>
<text x="1285.0" y="661.5" text-anchor="middle" font-size="11" font-weight="700" fill="#0b0b0b">Vector 8 đặc trưng</text>
<text x="1285.0" y="675.5" text-anchor="middle" font-size="9.8" font-weight="400" fill="#3d4f66">2 mạng × 4 lớp, đúng thứ tự metadata</text>
