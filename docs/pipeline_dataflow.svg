<path d="M 45 1084 h 900 v 50 l -12 12 h -888 z" fill="#fffbe9" stroke="#d9c98a"/>
<text x="57" y="1104" font-size="10.5" fill="#6b5b23">Vì sao giai đoạn 3 chạy phân loại lần thứ hai thay vì dùng lại kết quả của giai đoạn 2: mô hình hợp nhất được huấn luyện trên phân bố lớp</text>
<text x="57" y="1120" font-size="10.5" fill="#6b5b23">tính trên TOÀN BỘ mảnh có mô. Nếu lấy kết quả đã bị cổng lọc của giai đoạn 2 loại bớt, tỉ lệ lớp lành tính sẽ thấp một cách giả tạo và</text>
<text x="57" y="1136" font-size="10.5" fill="#6b5b23">vector đặc trưng không còn khớp với dữ liệu huấn luyện.</text>
</svg>