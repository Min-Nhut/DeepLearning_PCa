<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1580 1210" width="1580" height="1210" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#42536b"/></marker></defs>
<rect width="1580" height="1210" fill="#fcfcfb"/>
<text x="790" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0b0b0b">Luồng dữ liệu qua quy trình suy diễn ba giai đoạn</text>
<text x="790" y="55" text-anchor="middle" font-size="11.5" fill="#898781">Kích thước tensor ghi trên từng bước; mọi hằng số lấy trực tiếp từ mã nguồn</text>
<rect x="45" y="74" width="1490" height="152" rx="8" fill="#f7f9fc" stroke="#d8e0ea" stroke-dasharray="5 4"/>
<text x="59" y="94" font-size="12" font-weight="700" fill="#42536b">CHUẨN BỊ ĐẦU VÀO — đưa ảnh về đúng tỉ lệ vật lý lúc huấn luyện</text>
<rect x="70" y="112" width="240" height="96" rx="6" fill="#e8eef7" stroke="#2c4a6e" stroke-width="1.5"/>
<text x="190.0" y="156.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0b0b0b">Ảnh vi trường</text>
<text x="190.0" y="171.0" text-anchor="middle" font-size="10.3" font-weight="400" fill="#3d4f66">H × W × 3 (BGR)</text>
<rect x="348" y="112" width="250" height="96" rx="6" fill="#e8eef7" stroke="#2c4a6e" stroke-width="1.5"/>
<text x="473.0" y="149.25" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0b0b0b">Xác định µm/pixel</text>
<text x="473.0" y="163.75" text-anchor="middle" font-size="10.3" font-weight="400" fill="#3d4f66">thẻ tệp → hiệu chỉnh vật kính</text>
<text x="473.0" y="178.25" text-anchor="middle" font-size="10.3" font-weight="400" fill="#3d4f66">→ không có thì giữ nguyên</text>
<rect x="636" y="112" width="250" height="96" rx="6" fill="#e8eef7" stroke="#2c4a6e" stroke-width="1.5"/>
<text x="761.0" y="149.25" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0b0b0b">patch_size_for()</text>
<text x="761.0" y="163.75" text-anchor="middle" font-size="10.3" font-weight="400" fill="#3d4f66">lưới N px sao cho mỗi mảnh</text>
<text x="761.0" y="178.25" text-anchor="middle" font-size="10.3" font-weight="400" fill="#3d4f66">phủ đúng 243,1 µm</text>
<rect x="924" y="112" width="250" height="96" rx="6" fill="#e8eef7" stroke="#2c4a6e" stroke-width="1.5"/>
<text x="1049.0" y="149.25" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0b0b0b">Cắt lưới, biên dịch vào trong</text>
<text x="1049.0" y="163.75" text-anchor="middle" font-size="10.3" font-weight="400" fill="#3d4f66">mỗi mảnh sở hữu riêng</text>
<text x="1049.0" y="178.25" text-anchor="middle" font-size="10.3" font-weight="400" fill="#3d4f66">w_valid × h_valid</text>
<rect x="1212" y="112" width="268" height="96" rx="6" fill="#e8eef7" stroke="#2c4a6e" stroke-width="1.5"/>
<text x="1346.0" y="149.25" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0b0b0b">Lọc mô, chuẩn màu, đệm biên</text>
<text x="1346.0" y="163.75" text-anchor="middle" font-size="10.3" font-weight="400" fill="#3d4f66">ngưỡng bão hòa ≥ 40 + mở 3×3</text>
<text x="1346.0" y="178.25" text-anchor="middle" font-size="10.3" font-weight="400" fill="#3d4f66">Macenko chỉ khi ΔLAB &gt; 30</text>
