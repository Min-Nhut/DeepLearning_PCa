<rect x="45" y="340" width="470" height="700" rx="8" fill="#f7f9fc" stroke="#d8e0ea" stroke-dasharray="5 4"/>
<text x="59" y="360" font-size="12" font-weight="700" fill="#42536b">GIAI ĐOẠN 1 — PHÂN ĐOẠN 6 LỚP</text>
<rect x="70" y="382" width="420" height="62" rx="6" fill="#ffffff" stroke="#2c4a6e" stroke-width="1.5"/>
<text x="280.0" y="409.5" text-anchor="middle" font-size="11" font-weight="700" fill="#0b0b0b">Resize 500 → 256 (song tuyến)</text>
<text x="280.0" y="423.5" text-anchor="middle" font-size="9.8" font-weight="400" fill="#3d4f66">chuẩn hóa ImageNet</text>
<rect x="70" y="466" width="420" height="54" rx="6" fill="#ffffff" stroke="#2c4a6e" stroke-width="1.5"/>
<text x="280.0" y="489.5" text-anchor="middle" font-size="11" font-weight="700" fill="#0b0b0b">U-Net (DenseNet121 / EfficientNet_b0)</text>
<text x="280.0" y="503.5" text-anchor="middle" font-size="9.8" font-weight="400" fill="#3d4f66">hoặc DeepLabV3+</text>
<rect x="70" y="542" width="420" height="46" rx="6" fill="#ffffff" stroke="#2c4a6e" stroke-width="1.5"/>
<text x="280.0" y="568.5" text-anchor="middle" font-size="11" font-weight="700" fill="#0b0b0b">logits 6 × 256 × 256</text>
<rect x="70" y="610" width="420" height="46" rx="6" fill="#ffffff" stroke="#2c4a6e" stroke-width="1.5"/>
<text x="280.0" y="636.5" text-anchor="middle" font-size="11" font-weight="700" fill="#0b0b0b">argmax → nhãn 256 × 256</text>
<rect x="70" y="678" width="420" height="62" rx="6" fill="#ffffff" stroke="#2c4a6e" stroke-width="1.5"/>
<text x="280.0" y="705.5" text-anchor="middle" font-size="11" font-weight="700" fill="#0b0b0b">Resize 256 → 500</text>
<text x="280.0" y="719.5" text-anchor="middle" font-size="9.8" font-weight="400" fill="#3d4f66">NGƯỜI GẦN NHẤT — bắt buộc</text>
<rect x="70" y="762" width="420" height="62" rx="6" fill="#ffffff" stroke="#2c4a6e" stroke-width="1.5"/>
<text x="280.0" y="789.5" text-anchor="middle" font-size="11" font-weight="700" fill="#0b0b0b">Ghép theo vùng sở hữu</text>
<text x="280.0" y="803.5" text-anchor="middle" font-size="9.8" font-weight="400" fill="#3d4f66">không chồng lấn, không bỏ sót</text>
<rect x="70" y="846" width="420" height="62" rx="6" fill="#ffffff" stroke="#2c4a6e" stroke-width="1.5"/>
<text x="280.0" y="873.5" text-anchor="middle" font-size="11" font-weight="700" fill="#0b0b0b">Mặt nạ H × W, nhãn 0–5</text>
<text x="280.0" y="887.5" text-anchor="middle" font-size="9.8" font-weight="400" fill="#3d4f66">nền · mô đệm · lành tính · G3 · G4 · G5</text>
<rect x="70" y="930" width="420" height="62" rx="6" fill="#ffffff" stroke="#2c4a6e" stroke-width="1.5"/>
<text x="280.0" y="957.5" text-anchor="middle" font-size="11" font-weight="700" fill="#0b0b0b">Đếm diện tích</text>
<text x="280.0" y="971.5" text-anchor="middle" font-size="9.8" font-weight="400" fill="#3d4f66">ung thư {3,4,5} / mô {2,3,4,5}</text>
