<text x="554" y="360" font-size="12" font-weight="700" fill="#42536b">GIAI ĐOẠN 2 — PHÂN LOẠI 4 LỚP (qua cổng lọc)</text>
<path d="M 775 382 L 925 432 L 775 482 L 625 432 z" fill="#fdf3e3" stroke="#b8860b" stroke-width="1.5"/>
