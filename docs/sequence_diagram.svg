<polyline points="1060,846 1106,846 1106,872 1064,872" fill="none" stroke="#42536b" stroke-width="1.4" marker-end="url(#a)"/>
<text x="1114" y="863.0" text-anchor="start" font-size="10.5" font-weight="400" fill="#3d4f66">GĐ3 hợp nhất ISUP (2 mạng, toàn bộ mảnh mô)</text>
<polyline points="1060,902 1300,902" fill="none" stroke="#42536b" stroke-width="1.4" marker-end="url(#a)"/>
<text x="1180.0" y="895" text-anchor="middle" font-size="10.5" font-weight="400" fill="#3d4f66">ghi tệp mặt nạ PNG</text>
