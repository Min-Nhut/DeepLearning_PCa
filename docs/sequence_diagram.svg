<text x="440.0" y="1137" text-anchor="middle" font-size="10.5" font-weight="400" fill="#3d4f66">200  { status: 'completed', kết quả đầy đủ }</text>
<polyline points="320,1180 110,1180" fill="none" stroke="#42536b" stroke-width="1.4" marker-end="url(#a)"/>
<text x="215.0" y="1173" text-anchor="middle" font-size="10.5" font-weight="400" fill="#3d4f66">hiển thị “Hoàn tất” và nút Xem kết quả</text>
<rect x="660" y="1245" width="620" height="44" rx="4" fill="#fff5f5" stroke="#d98a8a"/>
<text x="670" y="1261" text-anchor="start" font-size="10" font-weight="700" fill="#a34a4a">alt  [lỗi bất kỳ trong quá trình xử lý]</text>
<text x="670" y="1279" text-anchor="start" font-size="10" font-weight="400" fill="#a34a4a">UPDATE status = 'failed', error_message — không bao giờ kẹt ở 'running'</text>
