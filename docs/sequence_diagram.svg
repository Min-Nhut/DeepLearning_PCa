<text x="1300.0" y="98.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#12263f">SQLite</text>
<text x="1300.0" y="113.5" text-anchor="middle" font-size="10.5" font-weight="400" fill="#3d4f66">+ kho tệp</text>
