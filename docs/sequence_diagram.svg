<text x="440.0" y="419" text-anchor="middle" font-size="10.5" font-weight="400" fill="#3d4f66">200  { status }</text>
<polyline points="810,478 856,478 856,504 814,504" fill="none" stroke="#42536b" stroke-width="1.4" marker-end="url(#a)"/>
<text x="864" y="495.0" text-anchor="start" font-size="10.5" font-weight="400" fill="#3d4f66">xin giấy phép chạy (chờ nếu đang bận)</text>
<polyline points="810,530 1300,530" fill="none" stroke="#42536b" stroke-width="1.4" marker-end="url(#a)"/>
<text x="1055.0" y="523" text-anchor="middle" font-size="10.5" font-weight="400" fill="#3d4f66">UPDATE inference_runs SET status = 'running'</text>
<polyline points="810,570 1300,570" fill="none" stroke="#42536b" stroke-width="1.4" marker-end="url(#a)"/>
<text x="1055.0" y="563" text-anchor="middle" font-size="10.5" font-weight="400" fill="#3d4f66">đọc metadata ảnh + bảng hiệu chỉnh µm/pixel</text>
<polyline points="1300,606 810,606" fill="none" stroke="#42536b" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="1055.0" y="599" text-anchor="middle" font-size="10.5" font-weight="400" fill="#3d4f66">µm/pixel (metadata tệp → hiệu chỉnh → không có)</text>
<polyline points="810,650 1060,650" fill="none" stroke="#42536b" stroke-width="1.4" marker-end="url(#a)"/>
<text x="935.0" y="643" text-anchor="middle" font-size="10.5" font-weight="400" fill="#3d4f66">tile_image(ảnh, patch_size_for(µm/pixel))</text>
<polyline points="1060,690 1106,690 1106,716 1064,716" fill="none" stroke="#42536b" stroke-width="1.4" marker-end="url(#a)"/>
<text x="1114" y="707.0" text-anchor="start" font-size="10.5" font-weight="400" fill="#3d4f66">nạp trọng số từ registry (cache trong bộ nhớ)</text>
