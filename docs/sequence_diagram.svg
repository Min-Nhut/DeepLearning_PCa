<text x="440.0" y="317" text-anchor="middle" font-size="10.5" font-weight="400" fill="#3d4f66">201 Created  { run_id, status: 'pending' }</text>
<rect x="200" y="354" width="490" height="86" rx="4" fill="none" stroke="#9fb3c8" stroke-dasharray="4 3"/>
<text x="208" y="368" text-anchor="start" font-size="10" font-weight="700" fill="#5a7794">loop  [mỗi 2,5 giây khi còn chờ / đang chạy]</text>
