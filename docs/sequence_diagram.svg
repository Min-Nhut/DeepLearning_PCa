<text x="864" y="1073.0" text-anchor="start" font-size="10.5" font-weight="400" fill="#3d4f66">trả lại giấy phép chạy</text>
<polyline points="320,1108 560,1108" fill="none" stroke="#42536b" stroke-width="1.4" marker-end="url(#a)"/>
<text x="440.0" y="1101" text-anchor="middle" font-size="10.5" font-weight="400" fill="#3d4f66">GET /api/images/{id}/inference</text>
