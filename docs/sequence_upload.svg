<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 1315" width="1560" height="1315" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#42536b"/></marker></defs>
<rect width="1560" height="1315" fill="#ffffff"/>
<text x="780" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#12263f">Biểu đồ tuần tự — Tải ảnh lên hoặc chụp trực tiếp qua kính hiển vi</text>
<text x="780" y="52" text-anchor="middle" font-size="11" fill="#6b7c92">Cùng một điểm cuối cho cả hai cách đưa ảnh vào; tiền xử lý chạy tự động ngay sau khi lưu</text>
<rect x="50.0" y="82" width="200" height="34" rx="6" fill="#e8eef7" stroke="#2c4a6e" stroke-width="1.5"/>
<text x="150.0" y="102" text-anchor="middle" font-size="11.5" font-weight="700" fill="#12263f">Bác sĩ</text>
<line x1="150.0" y1="116" x2="150.0" y2="1291" stroke="#c6d3e2" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="302.0" y="82" width="200" height="48" rx="6" fill="#e8eef7" stroke="#2c4a6e" stroke-width="1.5"/>
<text x="402.0" y="102" text-anchor="middle" font-size="11.5" font-weight="700" fill="#12263f">Giao diện</text>
<text x="402.0" y="116" text-anchor="middle" font-size="10" font-weight="400" fill="#3d4f66">Upload.tsx</text>
<line x1="402.0" y1="130" x2="402.0" y2="1291" stroke="#c6d3e2" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="554.0" y="82" width="200" height="48" rx="6" fill="#e8eef7" stroke="#2c4a6e" stroke-width="1.5"/>
<text x="654.0" y="102" text-anchor="middle" font-size="11.5" font-weight="700" fill="#12263f">API</text>
<text x="654.0" y="116" text-anchor="middle" font-size="10" font-weight="400" fill="#3d4f66">routers/cases.py</text>
<line x1="654.0" y1="130" x2="654.0" y2="1291" stroke="#c6d3e2" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="806.0" y="82" width="200" height="48" rx="6" fill="#e8eef7" stroke="#2c4a6e" stroke-width="1.5"/>
<text x="906.0" y="102" text-anchor="middle" font-size="11.5" font-weight="700" fill="#12263f">Luồng phụ</text>
<text x="906.0" y="116" text-anchor="middle" font-size="10" font-weight="400" fill="#3d4f66">run_in_threadpool</text>
<line x1="906.0" y1="130" x2="906.0" y2="1291" stroke="#c6d3e2" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="1058.0" y="82" width="200" height="34" rx="6" fill="#e8eef7" stroke="#2c4a6e" stroke-width="1.5"/>
<text x="1158.0" y="102" text-anchor="middle" font-size="11.5" font-weight="700" fill="#12263f">Kho tệp</text>
<line x1="1158.0" y1="116" x2="1158.0" y2="1291" stroke="#c6d3e2" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="1310.0" y="82" width="200" height="34" rx="6" fill="#e8eef7" stroke="#2c4a6e" stroke-width="1.5"/>
<text x="1410.0" y="102" text-anchor="middle" font-size="11.5" font-weight="700" fill="#12263f">CSDL SQLite</text>
<line x1="1410.0" y1="116" x2="1410.0" y2="1291" stroke="#c6d3e2" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="150.0" y1="156" x2="402.0" y2="156" stroke="#42536b" stroke-width="1.4" marker-end="url(#a)"/>
<text x="276.0" y="149" text-anchor="middle" font-size="10.5" font-weight="400" fill="#3d4f66">chọn tệp ảnh, hoặc bấm chụp từ camera</text>
<polyline points="402.0,196 448.0,196 448.0,222 406.0,222" fill="none" stroke="#42536b" stroke-width="1.4" marker-end="url(#a)"/>
<text x="458.0" y="213.0" text-anchor="start" font-size="10.5" font-weight="400" fill="#3d4f66">nếu là chụp: lấy khung hình vào canvas → toBlob</text>
<text x="458.0" y="228.0" text-anchor="start" font-size="9.5" font-weight="400" fill="#6b7c92" font-style="italic">cùng một điểm cuối, chỉ khác trường source</text>
<polyline points="402.0,264 448.0,264 448.0,290 406.0,290" fill="none" stroke="#42536b" stroke-width="1.4" marker-end="url(#a)"/>
<text x="458.0" y="281.0" text-anchor="start" font-size="10.5" font-weight="400" fill="#3d4f66">kiểm tra dung lượng phía client (200 MB)</text>
<text x="458.0" y="296.0" text-anchor="start" font-size="9.5" font-weight="400" fill="#6b7c92" font-style="italic">chỉ để tránh một vòng gửi vô ích</text>
<line x1="402.0" y1="332" x2="654.0" y2="332" stroke="#42536b" stroke-width="1.4" marker-end="url(#a)"/>
<text x="528.0" y="325" text-anchor="middle" font-size="10.5" font-weight="400" fill="#3d4f66">POST /api/cases/slides/{id}/images  (multipart)</text>
<text x="528.0" y="345" text-anchor="middle" font-size="9.5" font-weight="400" fill="#6b7c92" font-style="italic">file · description · source · magnification</text>
<polyline points="654.0,384 700.0,384 700.0,410 658.0,410" fill="none" stroke="#42536b" stroke-width="1.4" marker-end="url(#a)"/>
<text x="710.0" y="401.0" text-anchor="start" font-size="10.5" font-weight="400" fill="#3d4f66">kiểm tra source và độ phóng đại hợp lệ</text>
<line x1="654.0" y1="438" x2="1410.0" y2="438" stroke="#42536b" stroke-width="1.4" marker-end="url(#a)"/>
<text x="1032.0" y="431" text-anchor="middle" font-size="10.5" font-weight="400" fill="#3d4f66">đếm số ảnh hiện có của slide</text>
<rect x="594.0" y="464" width="946.0" height="46" rx="4" fill="#fff5f5" stroke="#d98a8a"/>
<text x="606.0" y="479" text-anchor="start" font-size="10" font-weight="700" fill="#a34a4a">alt  [đã đủ 8 ảnh trong slide]</text>
<text x="606.0" y="494" text-anchor="start" font-size="10" font-weight="400" fill="#a34a4a">400 Bad Request</text>
<polyline points="654.0,538 700.0,538 700.0,564 658.0,564" fill="none" stroke="#42536b" stroke-width="1.4" marker-end="url(#a)"/>
<text x="710.0" y="555.0" text-anchor="start" font-size="10.5" font-weight="400" fill="#3d4f66">đọc theo từng khối 1 MB</text>
<text x="710.0" y="570.0" text-anchor="start" font-size="9.5" font-weight="400" fill="#6b7c92" font-style="italic">vượt 200 MB → 413, không nạp cả tệp vào bộ nhớ</text>
<line x1="654.0" y1="606" x2="906.0" y2="606" stroke="#42536b" stroke-width="1.4" marker-end="url(#a)"/>
<text x="780.0" y="599" text-anchor="middle" font-size="10.5" font-weight="400" fill="#3d4f66">_process_and_store(dữ liệu thô)</text>
<polyline points="906.0,646 952.0,646 952.0,672 910.0,672" fill="none" stroke="#42536b" stroke-width="1.4" marker-end="url(#a)"/>
<text x="962.0" y="663.0" text-anchor="start" font-size="10.5" font-weight="400" fill="#3d4f66">Pillow giải mã thật để xác thực</text>
<text x="962.0" y="678.0" text-anchor="start" font-size="9.5" font-weight="400" fill="#6b7c92" font-style="italic">không tin phần mở rộng tên tệp</text>
<rect x="846.0" y="700" width="492.0" height="46" rx="4" fill="#fff5f5" stroke="#d98a8a"/>
<text x="858.0" y="715" text-anchor="start" font-size="10" font-weight="700" fill="#a34a4a">alt  [không giải mã được thành JPG / PNG / TIFF]</text>
<text x="858.0" y="730" text-anchor="start" font-size="10" font-weight="400" fill="#a34a4a">400 Bad Request</text>
<line x1="906.0" y1="774" x2="1158.0" y2="774" stroke="#42536b" stroke-width="1.4" marker-end="url(#a)"/>
<text x="1032.0" y="767" text-anchor="middle" font-size="10.5" font-weight="400" fill="#3d4f66">ghi ảnh gốc + thu nhỏ ≤ 320 px + xem nhanh ≤ 2400 px</text>
<line x1="906.0" y1="814" x2="654.0" y2="814" stroke="#42536b" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="780.0" y="807" text-anchor="middle" font-size="10.5" font-weight="400" fill="#3d4f66">định dạng, chiều rộng, chiều cao</text>
<line x1="654.0" y1="854" x2="1410.0" y2="854" stroke="#42536b" stroke-width="1.4" marker-end="url(#a)"/>
<text x="1032.0" y="847" text-anchor="middle" font-size="10.5" font-weight="400" fill="#3d4f66">INSERT images (image_number = số hiện có + 1)</text>
<line x1="654.0" y1="894" x2="906.0" y2="894" stroke="#42536b" stroke-width="1.4" marker-end="url(#a)"/>
<text x="780.0" y="887" text-anchor="middle" font-size="10.5" font-weight="400" fill="#3d4f66">run_preprocessing(ảnh xem nhanh)</text>
<text x="780.0" y="907" text-anchor="middle" font-size="9.5" font-weight="400" fill="#6b7c92" font-style="italic">chạy trên bản 2400 px, không phải ảnh gốc</text>
<polyline points="906.0,946 952.0,946 952.0,972 910.0,972" fill="none" stroke="#42536b" stroke-width="1.4" marker-end="url(#a)"/>
<text x="962.0" y="963.0" text-anchor="start" font-size="10.5" font-weight="400" fill="#3d4f66">độ mờ (Laplacian) · tách mô (Otsu HSV) · chuẩn màu Macenko</text>
<line x1="906.0" y1="1000" x2="1158.0" y2="1000" stroke="#42536b" stroke-width="1.4" marker-end="url(#a)"/>
<text x="1032.0" y="993" text-anchor="middle" font-size="10.5" font-weight="400" fill="#3d4f66">ghi mặt nạ mô (PNG) và ảnh chuẩn màu (JPG)</text>
<line x1="906.0" y1="1040" x2="654.0" y2="1040" stroke="#42536b" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="780.0" y="1033" text-anchor="middle" font-size="10.5" font-weight="400" fill="#3d4f66">cờ mờ, điểm chất lượng, đường dẫn tệp</text>
<line x1="654.0" y1="1080" x2="1410.0" y2="1080" stroke="#42536b" stroke-width="1.4" marker-end="url(#a)"/>
<text x="1032.0" y="1073" text-anchor="middle" font-size="10.5" font-weight="400" fill="#3d4f66">INSERT preprocessing_results  ·  INSERT audit_logs</text>
<rect x="594.0" y="1106" width="946.0" height="61" rx="4" fill="#fff5f5" stroke="#d98a8a"/>
<text x="606.0" y="1121" text-anchor="start" font-size="10" font-weight="700" fill="#a34a4a">alt  [tiền xử lý lỗi]</text>
<text x="606.0" y="1136" text-anchor="start" font-size="10" font-weight="400" fill="#a34a4a">ghi log và bỏ qua — ảnh đã được Pillow xác thực và lưu thành công rồi,</text>
<text x="606.0" y="1151" text-anchor="start" font-size="10" font-weight="400" fill="#a34a4a">một sự cố ở bước phụ không được phép làm hỏng việc tải ảnh</text>
<line x1="654.0" y1="1195" x2="402.0" y2="1195" stroke="#42536b" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="528.0" y="1188" text-anchor="middle" font-size="10.5" font-weight="400" fill="#3d4f66">201 Created  { image }</text>
<line x1="402.0" y1="1235" x2="150.0" y2="1235" stroke="#42536b" stroke-width="1.4" marker-end="url(#a)"/>
<text x="276.0" y="1228" text-anchor="middle" font-size="10.5" font-weight="400" fill="#3d4f66">hiện ảnh trong lưới, kèm nhãn độ phóng đại</text>
</svg>