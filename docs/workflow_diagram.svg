<rect width="1380" height="1200" fill="#ffffff"/>
<text x="690" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#12263f">Sơ đồ luồng nghiệp vụ — từ tạo ca bệnh đến phiếu kết quả</text>
