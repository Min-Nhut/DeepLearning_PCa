<rect x="530" y="312" width="300" height="54" rx="6" fill="#eef7f0" stroke="#2f6f4f" stroke-width="1.5"/>
<text x="680.0" y="335.0" text-anchor="middle" font-size="12" font-weight="700" fill="#12263f">Tiền xử lý tự động</text>
