<text x="250.0" y="657.0" text-anchor="middle" font-size="11" font-weight="400" fill="#3d4f66">không đáng tin (không rõ mô, hai</text>
<text x="250.0" y="673.0" text-anchor="middle" font-size="11" font-weight="400" fill="#3d4f66">mô hình mâu thuẫn)</text>
