<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1040" width="1440" height="1040" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#42536b"/></marker></defs>
<rect width="1440" height="1040" fill="#fcfcfb"/>
<text x="720" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0b0b0b">Quy trình chuẩn bị dữ liệu và chia tập huấn luyện</text>
<text x="720" y="55" text-anchor="middle" font-size="11.5" fill="#898781">Một lần chia duy nhất dùng chung cho cả hai nhánh mô hình — cơ chế chống rò rỉ dữ liệu</text>
<rect x="500" y="80" width="440" height="60" rx="6" fill="#e8eef7" stroke="#2c4a6e" stroke-width="1.5"/>
<text x="720.0" y="106.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0b0b0b">Bộ dữ liệu PANDA (Kaggle)</text>
<text x="720.0" y="121.0" text-anchor="middle" font-size="10.3" font-weight="400" fill="#3d4f66">Prostate cANcer graDe Assessment</text>
<polyline points="720,140 720,168" fill="none" stroke="#42536b" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="460" y="168" width="520" height="66" rx="6" fill="#fdf3e3" stroke="#b8860b" stroke-width="1.5"/>
<text x="720.0" y="197.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0b0b0b">Chỉ giữ tiêu bản của Radboud University Medical Center</text>
<text x="720.0" y="212.0" text-anchor="middle" font-size="10.3" font-weight="400" fill="#3d4f66">Karolinska có mặt nạ thô hơn (nền / lành tính / ung thư) nên phải loại</text>
<polyline points="720,234 720,262" fill="none" stroke="#42536b" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="300" y="262" width="840" height="118" rx="8" fill="#f7f9fc" stroke="#d8e0ea" stroke-dasharray="5 4"/>
<text x="314" y="282" font-size="12" font-weight="700" fill="#42536b">KIỂM SOÁT CHẤT LƯỢNG — bốn bước</text>
<rect x="322" y="300" width="186" height="74" rx="6" fill="#ffffff" stroke="#b8860b" stroke-width="1.5"/>
<text x="415.0" y="333.5" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0b0b0b">Loại mặt nạ rỗng</text>
<text x="415.0" y="347.0" text-anchor="middle" font-size="9.3" font-weight="400" fill="#3d4f66">hoặc thiếu</text>
<rect x="524" y="300" width="186" height="74" rx="6" fill="#ffffff" stroke="#b8860b" stroke-width="1.5"/>
<text x="617.0" y="333.5" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0b0b0b">Đối chiếu nhãn Gleason</text>
<text x="617.0" y="347.0" text-anchor="middle" font-size="9.3" font-weight="400" fill="#3d4f66">/ ISUP với bảng tham chiếu</text>
<polyline points="508,337 524,337" fill="none" stroke="#42536b" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="726" y="300" width="186" height="74" rx="6" fill="#ffffff" stroke="#b8860b" stroke-width="1.5"/>
<text x="819.0" y="333.5" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0b0b0b">Loại danh sách</text>
<text x="819.0" y="347.0" text-anchor="middle" font-size="9.3" font-weight="400" fill="#3d4f66">nhãn nhiễu đã biết</text>
<polyline points="710,337 726,337" fill="none" stroke="#42536b" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="928" y="300" width="186" height="74" rx="6" fill="#ffffff" stroke="#b8860b" stroke-width="1.5"/>
<text x="1021.0" y="333.5" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0b0b0b">Kiểm tra thị giác</text>
<text x="1021.0" y="347.0" text-anchor="middle" font-size="9.3" font-weight="400" fill="#3d4f66">thủ công</text>
<polyline points="912,337 928,337" fill="none" stroke="#42536b" stroke-width="1.4" marker-end="url(#a)"/>
<polyline points="720,380 720,466" fill="none" stroke="#42536b" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="420" y="466" width="600" height="72" rx="6" fill="#ffffff" stroke="#b8860b" stroke-width="1.5"/>
<text x="720.0" y="491.25" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0b0b0b">Danh sách ca sạch: 3.204 ca</text>
<text x="720.0" y="505.75" text-anchor="middle" font-size="10.3" font-weight="400" fill="#3d4f66">manifest.csv ghi 3.170 ca / 151.596 mảnh — hai con số lấy ở hai điểm khác nhau</text>
<text x="720.0" y="520.25" text-anchor="middle" font-size="10.3" font-weight="400" fill="#3d4f66">của quy trình và chưa được đối chiếu; cần thống nhất khi viết chương Dữ liệu</text>
<polyline points="720,538 720,566" fill="none" stroke="#42536b" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="420" y="566" width="600" height="72" rx="6" fill="#e8eef7" stroke="#2c4a6e" stroke-width="1.5"/>
<text x="720.0" y="591.25" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0b0b0b">Cắt mảnh 500 × 500 ở mức phân giải gốc (0,48619 µm/pixel)</text>
<text x="720.0" y="605.75" text-anchor="middle" font-size="10.3" font-weight="400" fill="#3d4f66">cửa sổ biên dịch vào trong nên không có mảnh đệm trắng;</text>
<text x="720.0" y="620.25" text-anchor="middle" font-size="10.3" font-weight="400" fill="#3d4f66">ảnh lưu JPEG, mặt nạ lưu PNG không mất mát</text>
<polyline points="720,638 720,666" fill="none" stroke="#42536b" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="420" y="666" width="600" height="66" rx="6" fill="#e8eef7" stroke="#2c4a6e" stroke-width="1.5"/>
<text x="720.0" y="688.25" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0b0b0b">Gán nhãn mảnh theo quy tắc của bài báo tham chiếu</text>
<text x="720.0" y="702.75" text-anchor="middle" font-size="10.3" font-weight="400" fill="#3d4f66">lành tính: 100% biểu mô lành tính · Gleason 3/4/5: mẫu đó chiếm ≥ 50% diện tích biểu mô</text>
<text x="720.0" y="717.25" text-anchor="middle" font-size="10.3" font-weight="400" fill="#3d4f66">mảnh không đạt ngưỡng nào thì không có nhãn phân loại</text>
<polyline points="720,732 720,762" fill="none" stroke="#42536b" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="420" y="762" width="600" height="66" rx="6" fill="#eef7f0" stroke="#2f6f4f" stroke-width="1.5"/>
<text x="720.0" y="784.25" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0b0b0b">Chia 80 / 10 / 10 THEO CA BỆNH</text>
<text x="720.0" y="798.75" text-anchor="middle" font-size="10.3" font-weight="400" fill="#3d4f66">phân tầng theo nhãn đa số của từng ca — không chia theo mảnh,</text>
<text x="720.0" y="813.25" text-anchor="middle" font-size="10.3" font-weight="400" fill="#3d4f66">nên không mảnh nào của một ca lọt sang tập khác</text>
<polyline points="620,828 620,856 330,856 330,884" fill="none" stroke="#42536b" stroke-width="1.4" marker-end="url(#a)"/>
<polyline points="820,828 820,856 1110,856 1110,884" fill="none" stroke="#42536b" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="140" y="884" width="380" height="76" rx="6" fill="#e8eef7" stroke="#2c4a6e" stroke-width="1.5"/>
<text x="330.0" y="911.25" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0b0b0b">Nhánh phân loại</text>
<text x="330.0" y="925.75" text-anchor="middle" font-size="10.3" font-weight="400" fill="#3d4f66">chỉ dùng mảnh CÓ nhãn</text>
<text x="330.0" y="940.25" text-anchor="middle" font-size="10.3" font-weight="400" fill="#3d4f66">4 lớp: lành tính · G3 · G4 · G5</text>
<rect x="920" y="884" width="380" height="76" rx="6" fill="#e8eef7" stroke="#2c4a6e" stroke-width="1.5"/>
<text x="1110.0" y="911.25" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0b0b0b">Nhánh phân đoạn</text>
<text x="1110.0" y="925.75" text-anchor="middle" font-size="10.3" font-weight="400" fill="#3d4f66">dùng MỌI mảnh có mặt nạ</text>
<text x="1110.0" y="940.25" text-anchor="middle" font-size="10.3" font-weight="400" fill="#3d4f66">6 lớp, dùng lại đúng lần chia bên trái</text>
<polyline points="720,828 720,884" fill="none" stroke="#42536b" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="560" y="884" width="320" height="76" rx="6" fill="#eef7f0" stroke="#2f6f4f" stroke-width="1.5"/>
<text x="720.0" y="911.25" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0b0b0b">Nhánh hợp nhất (giai đoạn 3)</text>
<text x="720.0" y="925.75" text-anchor="middle" font-size="10.3" font-weight="400" fill="#3d4f66">huấn luyện trên tập val + test</text>
<text x="720.0" y="940.25" text-anchor="middle" font-size="10.3" font-weight="400" fill="#3d4f66">634 ca — không còn tập độc lập thứ ba</text>
<path d="M 140 976 h 1160 v 34 l -12 12 h -1148 z" fill="#fffbe9" stroke="#d9c98a"/>
<text x="152" y="996" font-size="10.5" fill="#6b5b23">Chia theo ca bệnh chứ không theo mảnh, và hai nhánh mô hình dùng chung đúng một lần chia: nhờ vậy không có mảnh nào của cùng một tiêu bản</text>
<text x="152" y="1012" font-size="10.5" fill="#6b5b23">xuất hiện đồng thời ở tập huấn luyện và tập kiểm thử, kể cả khi một bước sau này kết hợp đặc trưng của cả hai nhánh trên cùng một ca.</text>
</svg>