  <text x="1482" y="738" text-anchor="middle" font-size="12" font-weight="600" fill="#42536b">Phần mềm cũ</text>
  <text x="1482" y="754" text-anchor="middle" font-size="12" font-weight="600" fill="#42536b">ImageCapture</text>

