    <ellipse cx="400" cy="452" rx="150" ry="27"/>
    <ellipse cx="400" cy="516" rx="150" ry="25"/>
    <ellipse cx="400" cy="576" rx="150" ry="25"/>
    <ellipse cx="400" cy="636" rx="150" ry="25"/>
    <ellipse cx="400" cy="696" rx="150" ry="25"/>
