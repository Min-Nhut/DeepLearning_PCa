  <g stroke="#6b7c92" stroke-width="2" fill="none">
    <circle cx="96" cy="606" r="14"/>
    <line x1="96" y1="620" x2="96" y2="658"/>
    <line x1="74" y1="632" x2="118" y2="632"/>
    <line x1="96" y1="658" x2="78" y2="686"/>
    <line x1="96" y1="658" x2="114" y2="686"/>
