  <line x1="120" y1="592" x2="256" y2="470" stroke="#6b7c92" stroke-width="1.3"/>

  <!-- ===== associations: admin ===== -->
  <g stroke="#42536b" stroke-width="1.3" fill="none">
    <line x1="1454" y1="330" x2="1320" y2="216"/>
    <line x1="1454" y1="330" x2="1320" y2="276"/>
    <line x1="1454" y1="336" x2="1320" y2="334"/>
    <line x1="1454" y1="340" x2="1320" y2="392"/>
    <line x1="1454" y1="344" x2="1320" y2="452"/>
    <line x1="1454" y1="348" x2="1320" y2="516"/>
    <line x1="1454" y1="352" x2="1320" y2="576"/>
  </g>
  <polyline points="1482,270 1482,126 908,126" fill="none" stroke="#42536b" stroke-width="1.3"/>

