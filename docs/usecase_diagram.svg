    <circle cx="1482" cy="620" r="14"/>
    <line x1="1482" y1="634" x2="1482" y2="672"/>
    <line x1="1460" y1="646" x2="1504" y2="646"/>
    <line x1="1482" y1="672" x2="1464" y2="700"/>
