    <line x1="550" y1="446" x2="662" y2="348"/>
    <!-- view slide -> tile pyramid -->
    <line x1="550" y1="512" x2="662" y2="400"/>
    <!-- report -> case-level aggregation -->
    <line x1="550" y1="930" x2="664" y2="690"/>
    <!-- confirm review -> audit log. Only the two nearest links to the audit use case
