  <text x="96" y="724" text-anchor="middle" font-size="12" font-weight="600" fill="#42536b">Camera kính</text>
  <text x="96" y="740" text-anchor="middle" font-size="12" font-weight="600" fill="#42536b">hiển vi</text>

  <!-- Quản trị viên -->
  <g stroke="#1e3a5f" stroke-width="2" fill="none">
    <circle cx="1482" cy="292" r="16"/>
    <line x1="1482" y1="308" x2="1482" y2="352"/>
