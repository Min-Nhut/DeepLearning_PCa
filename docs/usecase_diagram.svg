    <text x="400" y="277">Quản lý ca bệnh</text>
    <text x="400" y="337">Quản lý slide trong ca</text>
    <text x="400" y="397">Tải ảnh vi trường lên</text>
    <text x="400" y="448">Chụp ảnh trực tiếp</text>
    <text x="400" y="463">qua kính hiển vi</text>
    <text x="400" y="521">Xem tiêu bản (thu phóng sâu)</text>
    <text x="400" y="581">Chạy phân tích AI</text>
    <text x="400" y="641">Khoanh vùng thủ công</text>
    <text x="400" y="701">Đo khoảng cách trên tiêu bản</text>
    <text x="400" y="754">Lập / chỉnh sửa</text>
    <text x="400" y="769">đánh giá chẩn đoán</text>
    <text x="400" y="827">Đánh dấu cần hội chẩn</text>
    <text x="400" y="887">Xác nhận &amp; khóa đánh giá</text>
    <text x="400" y="941">Xem &amp; in phiếu kết quả</text>
  </g>

