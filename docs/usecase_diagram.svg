  <text x="790" y="337" text-anchor="middle" font-size="12" fill="#1c3f66">Tiền xử lý ảnh tự động</text>

  <ellipse cx="790" cy="392" rx="128" ry="24" fill="#ffffff" stroke="#4a7ab5" stroke-width="1.5"/>
  <text x="790" y="397" text-anchor="middle" font-size="12" fill="#1c3f66">Sinh tháp ảnh thu phóng</text>

  <ellipse cx="790" cy="840" rx="128" ry="24" fill="#ffffff" stroke="#4a7ab5" stroke-width="1.5"/>
  <text x="790" y="845" text-anchor="middle" font-size="12" fill="#1c3f66">Ghi nhật ký thao tác</text>

