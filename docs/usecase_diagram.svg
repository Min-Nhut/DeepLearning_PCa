  <text x="790" y="450" text-anchor="middle" font-size="12" font-weight="700" fill="#2f5d8f">QUY TRÌNH SUY DIỄN AI</text>

  <!-- ===== actors ===== -->
  <!-- Bác sĩ -->
  <g stroke="#1e3a5f" stroke-width="2" fill="none">
    <circle cx="96" cy="392" r="16"/>
    <line x1="96" y1="408" x2="96" y2="452"/>
    <line x1="70" y1="422" x2="122" y2="422"/>
    <line x1="96" y1="452" x2="76" y2="486"/>
    <line x1="96" y1="452" x2="116" y2="486"/>
  </g>
  <text x="96" y="508" text-anchor="middle" font-size="13" font-weight="700" fill="#12263f">Bác sĩ</text>
  <text x="96" y="524" text-anchor="middle" font-size="13" font-weight="700" fill="#12263f">giải phẫu bệnh</text>

  <!-- Camera: sits just below the doctor so its single association to the live-capture
