<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1580 1040" width="1580" height="1040" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7c92"/>
    </marker>
  </defs>

  <rect width="1580" height="1040" fill="#ffffff"/>

  <text x="790" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#12263f">Sơ đồ Use Case — Hệ thống ProstaAI</text>
  <text x="790" y="54" text-anchor="middle" font-size="12" fill="#6b7c92">Hỗ trợ chấm điểm Gleason trên tiêu bản sinh thiết tuyến tiền liệt</text>

  <!-- ===== system boundary ===== -->
  <rect x="196" y="72" width="1180" height="920" rx="10" fill="none" stroke="#1e3a5f" stroke-width="2"/>
  <text x="786" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a5f">HỆ THỐNG ProstaAI</text>

  <!-- group panels -->
  <rect x="220" y="150" width="360" height="825" rx="8" fill="#f7f9fc" stroke="#d8e0ea" stroke-dasharray="5 4"/>
  <text x="400" y="170" text-anchor="middle" font-size="12" font-weight="700" fill="#42536b">CỔNG BÁC SĨ (cổng 5173)</text>

  <rect x="982" y="150" width="372" height="470" rx="8" fill="#f7f9fc" stroke="#d8e0ea" stroke-dasharray="5 4"/>
  <text x="1168" y="170" text-anchor="middle" font-size="12" font-weight="700" fill="#42536b">CỔNG QUẢN TRỊ (cổng 5174)</text>

