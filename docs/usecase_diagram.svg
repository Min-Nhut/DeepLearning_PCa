    <line x1="550" y1="826" x2="662" y2="836"/>
    <line x1="550" y1="884" x2="662" y2="846"/>
  </g>

  <g font-size="10.5" fill="#7a8ba0" font-style="italic">
    <text x="600" y="530" text-anchor="middle">«include»</text>
    <text x="602" y="376" text-anchor="middle">«include»</text>
    <text x="612" y="800" text-anchor="middle">«include»</text>
    <text x="606" y="866" text-anchor="middle">«include»</text>
  </g>

  <!-- note on audit -->
  <path d="M 640 892 h 300 v 66 l -12 12 h -288 z" fill="#fffbe9" stroke="#d9c98a"/>
  <path d="M 940 946 l -12 12 v -12 z" fill="#e8dcae" stroke="#d9c98a"/>
  <text x="654" y="912" font-size="11" fill="#6b5b23">Mọi use case làm thay đổi dữ liệu đều</text>
  <text x="654" y="928" font-size="11" fill="#6b5b23">«include» Ghi nhật ký thao tác. Sơ đồ chỉ vẽ</text>
  <text x="654" y="944" font-size="11" fill="#6b5b23">hai liên kết đại diện để giữ hình dễ đọc.</text>

  <!-- note on portals -->
  <path d="M 982 660 h 372 v 84 l -12 12 h -360 z" fill="#f4f7fb" stroke="#c6d3e2"/>
  <path d="M 1354 732 l -12 12 v -12 z" fill="#dde6f0" stroke="#c6d3e2"/>
  <text x="996" y="680" font-size="11" fill="#3d4f66">Hai cổng chạy trên hai origin khác nhau nên</text>
  <text x="996" y="696" font-size="11" fill="#3d4f66">hai phiên đăng nhập độc lập. Đây là ranh giới</text>
  <text x="996" y="712" font-size="11" fill="#3d4f66">phiên làm việc, không phải kiểm soát truy cập —</text>
  <text x="996" y="728" font-size="11" fill="#3d4f66">quyền thật do máy chủ cưỡng chế trên từng API.</text>

